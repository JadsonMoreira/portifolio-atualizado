<!doctype html>
<html lang="pt-BR" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jadson Moreira | Engenheiro de Software Fullstack</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Fira+Code:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --navy: #0a192f;
        --light-navy: #112240;
        --lightest-navy: #233554;
        --slate: #8892b0;
        --light-slate: #a8b2d1;
        --lightest-slate: #ccd6f6;
        --white: #e6f1ff;
        --green: #64ffda;
        --accent-glow: rgba(100, 255, 218, 0.2);
        --bg-opacity: rgba(10, 25, 47, 0.8);
      }

      html.light {
        --navy: #f1f5f9;
        --light-navy: #ffffff;
        --lightest-navy: #cbd5e1;
        --slate: #475569;
        --light-slate: #334155;
        --lightest-slate: #0f172a;
        --white: #020617;
        --green: #0d9488;
        --accent-glow: rgba(13, 148, 136, 0.1);
        --bg-opacity: rgba(241, 245, 249, 0.8);
      }

      html {
        scroll-behavior: smooth !important;
      }

      body {
        font-family: "Inter", sans-serif;
        background-color: var(--navy);
        color: var(--slate);
        line-height: 1.5;
        transition:
          background-color 0.3s ease,
          color 0.3s ease;
      }
      .font-mono {
        font-family: "Fira Code", monospace;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: var(--navy);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--lightest-navy);
        border-radius: 5px;
      }

      .project-image-filter {
        filter: grayscale(100%) contrast(1) brightness(90%);
        mix-blend-mode: multiply;
        transition: all 0.3s ease;
      }
      html.light .project-image-filter {
        mix-blend-mode: normal;
        filter: grayscale(50%);
      }
      .project-image-container:hover .project-image-filter {
        filter: none;
        mix-blend-mode: normal;
      }
      .nav-link::before {
        content: attr(data-num);
        color: var(--green);
        font-family: "Fira Code", monospace;
        font-size: 13px;
        margin-right: 5px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
